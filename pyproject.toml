[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractguard"
version = "0.6.0.dev0"
description = "Framework-independent governed execution reference MVP"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
contractguard-demo = "contractguard.__main__:main"

[tool.setuptools.packages.find]
include = ["contractguard*"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
analytics = ["duckdb>=1.2,<2"]
server = ["gunicorn>=23,<24"]

e2e = ["web3>=7,<8"]
