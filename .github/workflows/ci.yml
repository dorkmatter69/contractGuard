name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m contractguard
      - run: python -m pip install .
      - run: contractguard-demo
        working-directory: /tmp
  database-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: contractguard_test
          POSTGRES_USER: contractguard
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contractguard"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CONTRACTGUARD_TEST_POSTGRES: postgresql://contractguard:ci-only-password@localhost:5432/contractguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[postgres,analytics]'
      - run: python -m unittest discover -s tests -v
