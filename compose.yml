services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: contractguard
      POSTGRES_USER: contractguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractguard"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      CONTRACTGUARD_DATABASE: postgresql://contractguard:${POSTGRES_PASSWORD}@postgres:5432/contractguard
      CONTRACTGUARD_TENANT: ${CONTRACTGUARD_TENANT:?Set tenant identity}
      CONTRACTGUARD_IDENTITIES: ${CONTRACTGUARD_IDENTITIES:?Set SHA256 token-hash identity mapping}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  postgres-data:
